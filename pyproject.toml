[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "antescofo-api"
version = "0.3.0"
description = "Official Python client for Antescofo music intelligence APIs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antescofo", email = "research@antescofo.com" }]
dependencies = ["requests>=2.32,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://platform.antescofo.com"
Documentation = "https://platform.antescofo.com/api-docs/"
Repository = "https://github.com/Antescofo/antescofo-api-python"
Issues = "https://github.com/Antescofo/antescofo-api-python/issues"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "requests-mock>=1.12,<2",
  "ruff>=0.11,<1",
  "types-requests>=2.32,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/antescofo_api"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/.env.example", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/antescofo_api"]

[tool.coverage.run]
source = ["antescofo_api"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
